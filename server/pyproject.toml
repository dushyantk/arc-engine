[project]
name = "dailies-server"
version = "0.1.0"
description = "Agent runtime for Arc Engine: planner, generation adapter, critic, revision agent, approval gate."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "clickhouse-connect>=0.8",
    "google-genai>=1.0",
    "mcp>=1.0",
    "asyncpg>=0.30",
    "minio>=7.2",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The runtime's packages (agents/, db/, models/, storage/) sit at the server
# root and are imported as top-level, the same way run_session.py does it.
pythonpath = ["."]
markers = [
    "stack: needs the docker-compose stack up (Postgres, ClickHouse, MinIO)",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
