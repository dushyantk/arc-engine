# ClickHouse for Dailies — production memory (continuity fingerprints, QC
# findings, the agent decision log every cost figure is read from).
#
# On Fly rather than ClickHouse Cloud deliberately: Cloud would mean another
# vendor account and another card, and this is a single-node store for a
# single-operator product. One machine with a volume is the honest size of it.
#
# Reachable publicly over TLS because Vercel reads it directly (lib/clickhouse.ts
# runs server-side in the Next app, outside Fly's private network). It is
# password-protected and the password is a Fly secret; there is no anonymous
# access. Routing those reads through the FastAPI runtime instead would let this
# be private, and is the better shape if this ever grows past one operator.
app = "dailies-clickhouse"
primary_region = "iad"

[build]
  # A Dockerfile rather than the bare image, for one line: an explicit
  # listen_host. See listen.xml.
  dockerfile = "Dockerfile"

[[mounts]]
  source = "clickhouse_data"
  destination = "/var/lib/clickhouse"

[http_service]
  internal_port = 8123
  force_https = true
  # Never scaled to zero: a cold start mid-run would look like a ClickHouse
  # outage to the critic, and the decision log is written during runs.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
